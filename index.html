<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial Digital</title>
    <!-- Enlace Font Awesome (Versión 6.5.1) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <article class="credencial-card">
        
        <!-- Insignia -->
        <span class="insignia">BOOTCAMP 2026</span>

        <header>
            <!-- Contenedor del avatar con su etiqueta -->
            <div class="avatar-container">
                <img src="img/Avatar.jpg" alt="Foto de perfil">
                <span class="status-badge">ONLINE</span>
            </div>
            <h1>Soranny Cuesta Murillo</h1>
            <h2>Desarrolladora Junior Full Stack/Java</h2>
        </header>

        <!-- Sección de información  -->
        <section class="section-info">
            
            <!-- Ciudad -->
            <div class="dato-item">
                <i class="fa-solid fa-map-pin"></i>
                <p>Medellín, Colombia</p>
            </div>
            
            <!-- Correo -->
            <div class="dato-item">
                <i class="fa-solid fa-envelope"></i>
                <p>desarrolladora@devgenn.com</p>
            </div>
            
            <!-- Tecnología -->
            <div class="dato-item">
                <i class="fa-solid fa-code"></i>
                <p><strong>Tecnología:</strong> JavaScript</p>
            </div>
            
            <!-- Hobby -->
            <div class="dato-item">
                <p><strong>Hobby:</strong> Fotografía urbana</p>
            </div>

        </section>
        
        <!-- Pie de página -->
        <footer>
            <div class="github-container">
                <!-- Enlace de GitHub -->
                <a href="https://github.com" target="_blank">
                    <i class="fa-brands fa-github"></i> GitHub Profile
                </a>
            </div>
            <blockquote class="frase-personal">
                "El código es como el arte; se construye detalle a detalle."
            </blockquote>
        </footer>

    </article>

</body>

</html>
