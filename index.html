<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial Digital</title>
    <!-- Enlace Font Awesome (Versión 6.5.1) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <article class="credencial-card">
        
        <!-- Insignia -->
        <span class="insignia">BOOTCAMP 2026</span>

        <!-- COLUMNA IZQUIERDA -->
        <header>
            <div class="avatar-container">
                <img src="img/Avatar.jpg" alt="Foto de perfil">
                <span class="status-badge">ONLINE</span>
            </div>
        </header>

        <!-- COLUMNA DERECHA (Datos y Pie de página juntos) -->
        <div class="datos-y-pie">
            
            <div class="titulos-usuario">
                <h1>Soranny Cuesta Murillo</h1>
                <h2>Desarrolladora Junior Full Stack/Java</h2>
            </div>

            <!-- Sección de información -->
            <section class="section-info">
                <!-- Ciudad -->
                <div class="dato-item">
                    <span class="label-cedula"><i class="fa-solid fa-map-pin"></i> Ubicación</span>
                    <p>Medellín, Colombia</p>
                </div>
                
                <!-- Correo -->
                <div class="dato-item">
                    <span class="label-cedula"><i class="fa-solid fa-envelope"></i> Correo</span>
                    <p>desarrolladora@devgenn.com</p>
                </div>
                
                <!-- Tecnología y Hobby unificados en filas limpias -->
                <div class="dato-item">
                    <span class="label-cedula"><i class="fa-solid fa-code"></i> Tecnología Principal</span>
                    <p>JavaScript</p>
                </div>
                
                <div class="dato-item">
                    <span class="label-cedula"><i class="fa-solid fa-camera"></i> Hobby</span>
                    <p>Fotografía urbana</p>
                </div>
            </section>
            
            <!-- Pie de página integrado -->
            <footer>
                <div class="github-container">
                    <a href="https://github.com/sorannycuesta" target="_blank">
                        <i class="fa-brands fa-github"></i> GitHub Profile
                    </a>
                </div>
                <blockquote class="frase-personal">
                    "El código es como el arte; se construye detalle a detalle."
                </blockquote>
            </footer>

        </div>

    </article>

</body>

</html>
